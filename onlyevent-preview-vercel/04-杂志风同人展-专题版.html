<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>杂志风同人展</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,"Noto Sans SC","Noto Sans JP",system-ui,sans-serif;color:#111}a{text-decoration:none;color:inherit}button,input{font:inherit}.wrap{max-width:1220px;margin:auto;padding:0 28px}.muted{color:#72757f}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.placeholder{background:linear-gradient(135deg,#e9ebf0,#d9dde5);position:relative;overflow:hidden}.placeholder:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 20px,rgba(255,255,255,.35) 20px 21px)}@media(max-width:760px){.wrap{padding:0 16px}}
