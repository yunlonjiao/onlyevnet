<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏风主题活动</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,"Noto Sans SC","Noto Sans JP",system-ui,sans-serif;color:#111}a{text-decoration:none;color:inherit}button,input{font:inherit}.wrap{max-width:1220px;margin:auto;padding:0 28px}.muted{color:#72757f}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.placeholder{background:linear-gradient(135deg,#e9ebf0,#d9dde5);position:relative;overflow:hidden}.placeholder:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 20px,rgba(255,255,255,.35) 20px 21px)}@media(max-width:760px){.wrap{padding:0 16px}}
body{background:#0a0b10;color:#fff;overflow-x:hidden}.loader{position:fixed;inset:0;background:#08090d;z-index:99;display:grid;place-items:center;transition:clip-path 1s cubic-bezier(.77,0,.18,1);clip-path:inset(0)}.loader.hide{clip-path:inset(0 0 100% 0)}.loader span{font-size:12px;letter-spacing:.35em}.hud{position:fixed;left:0;right:0;top:0;z-index:40}.hud .wrap{height:74px;display:flex;justify-content:space-between;align-items:center}.hud nav{display:flex;gap:20px;font-size:12px;font-weight:800}.hero{height:100vh;position:relative;overflow:hidden;display:flex;align-items:flex-end}.layer{position:absolute;inset:-8%;transition:transform 1.6s cubic-bezier(.2,.8,.2,1)}.l1{background:radial-gradient(circle at 70% 34%,#8256ff 0 9%,transparent 27%),radial-gradient(circle at 52% 58%,#ff56ba 0 11%,transparent 31%),linear-gradient(135deg,#1c2030,#0a0b10)}.l2{background:linear-gradient(115deg,transparent 55%,rgba(255,255,255,.08) 56%,transparent 57%)}.hero-copy{position:relative;z-index:3;padding-bottom:55px}.hero h1{font-size:clamp(72px,12vw,164px);line-height:.75;margin:0;letter-spacing:-.06em}.chapter{min-height:100vh;position:relative;display:grid;place-items:center;overflow:hidden;border-top:1px solid #262938}.chapter-inner{width:min(1180px,calc(100% - 40px));display:grid;grid-template-columns:.85fr 1.15fr;gap:80px;align-items:center}.chapter:nth-child(even) .chapter-inner{grid-template-columns:1.15fr .85fr}.visual{height:580px;position:relative;background:linear-gradient(145deg,#242836,#101219);overflow:hidden}.wipe{position:absolute;inset:0;background:#fff;transform:translateX(0);transition:transform 1.1s cubic-bezier(.76,0,.24,1)}.chapter.active .wipe{transform:translateX(101%)}.copy{opacity:0;transform:translateY(50px);transition:.8s .15s}.chapter.active .copy{opacity:1;transform:none}.copy h2{font-size:clamp(54px,8vw,100px);line-height:.88;margin:12px 0}.side-dots{position:fixed;right:24px;top:50%;z-index:30;display:grid;gap:10px}.side-dots i{width:8px;height:8px;border:1px solid #fff;border-radius:50%}.side-dots i.on{background:#fff}@media(max-width:820px){.hud nav{display:none}.chapter-inner,.chapter:nth-child(even) .chapter-inner{grid-template-columns:1fr}.visual{height:42vh}.side-dots{display:none}}
</style>
<style id="hf-polish">
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,9,16,.65),transparent 45%);pointer-events:none}.hero-copy{z-index:5}
.chapter{scroll-snap-align:start}.visual{box-shadow:0 40px 100px rgba(0,0,0,.28)}.visual:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(137,93,255,.28),transparent 36%);z-index:0}.copy .eyebrow{color:#b5b9c8}.copy h2{max-width:520px}.scrollhint:after{content:"";display:block;width:1px;height:70px;background:#fff;margin:12px auto 0;opacity:.5;animation:hint 1.8s ease-in-out infinite}@keyframes hint{0%,100%{transform:scaleY(.3);transform-origin:top}50%{transform:scaleY(1)}}

</head><body>
<div class="loader"><span>ENTERING EVENT</span></div><header class="hud"><div class="wrap"><b>EVENT TITLE</b><nav><a>ABOUT</a><a>GUEST</a><a>STAGE</a><a>GUIDE</a></nav></div></header><div class="side-dots"><i class="on"></i><i></i><i></i><i></i></div><section class="hero"><div class="layer l1"></div><div class="layer l2"></div><div class="wrap hero-copy"><div class="eyebrow">SPECIAL EVENT</div><h1>EVENT<br>TITLE</h1><p>00.00 — 00.00 / VENUE NAME</p></div></section><section class="chapter"><div class="chapter-inner"><div class="copy"><div class="eyebrow">01 / ABOUT</div><h2>ABOUT</h2><p class="muted">章节切换以整屏为单位。</p></div><div class="visual"><div class="wipe"></div></div></div></section><section class="chapter"><div class="chapter-inner"><div class="visual"><div class="wipe"></div></div><div class="copy"><div class="eyebrow">02 / GUEST</div><h2>GUEST</h2><p class="muted">视觉与文字同步进入。</p></div></div></section><section class="chapter"><div class="chapter-inner"><div class="copy"><div class="eyebrow">03 / STAGE</div><h2>STAGE</h2><p class="muted">接近游戏专题官网的整屏章节浏览。</p></div><div class="visual"><div class="wipe"></div></div></div></section>
<script>addEventListener('load',()=>setTimeout(()=>document.querySelector('.loader').classList.add('hide'),420));addEventListener('mousemove',e=>{let x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;document.querySelector('.l1').style.transform=`translate(${x*18}px,${y*14}px) scale(1.02)`;document.querySelector('.l2').style.transform=`translate(${x*-12}px,${y*-8}px)`});const ch=[...document.querySelectorAll('.chapter')],dots=[...document.querySelectorAll('.side-dots i')];const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){ch.forEach(x=>x.classList.remove('active'));e.target.classList.add('active');let n=ch.indexOf(e.target)+1;dots.forEach((d,i)=>d.classList.toggle('on',i===n))}}),{threshold:.55});ch.forEach(x=>io.observe(x));</script></body></html>
