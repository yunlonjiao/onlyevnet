<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海报风主题活动</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,"Noto Sans SC","Noto Sans JP",system-ui,sans-serif;color:#111}a{text-decoration:none;color:inherit}button,input{font:inherit}.wrap{max-width:1220px;margin:auto;padding:0 28px}.muted{color:#72757f}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.placeholder{background:linear-gradient(135deg,#e9ebf0,#d9dde5);position:relative;overflow:hidden}.placeholder:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 20px,rgba(255,255,255,.35) 20px 21px)}@media(max-width:760px){.wrap{padding:0 16px}}
body{background:#f1e9db}.poster{min-height:100vh;display:grid;grid-template-columns:58% 42%;overflow:hidden}.art{position:relative;background:#f45b48;margin:20px;overflow:hidden}.orb{position:absolute;border-radius:50%;mix-blend-mode:multiply}.o1{width:420px;height:420px;background:#6b57ff;right:-80px;top:4%}.o2{width:280px;height:280px;background:#ffdf4f;left:8%;bottom:7%}.o3{width:160px;height:160px;background:#00b89b;right:20%;bottom:25%}.vertical{position:absolute;left:24px;top:24px;writing-mode:vertical-rl;color:#fff;letter-spacing:.2em;font-size:12px;font-weight:900}.copy{padding:64px;display:flex;flex-direction:column;justify-content:center}.copy h1{font-size:clamp(64px,9vw,130px);line-height:.78;margin:14px 0}.facts{margin-top:34px;border-top:2px solid #111}.fact{display:grid;grid-template-columns:120px 1fr;padding:14px 0;border-bottom:1px solid #111}.link{margin-top:26px;display:inline-block;padding:12px 18px;background:#111;color:#fff;width:max-content}@media(max-width:820px){.poster{grid-template-columns:1fr}.art{min-height:55vh}.copy{padding:34px 22px}}
</style>
<style id="hf-polish">
.art{box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}.art:after{content:"00 / EVENT";position:absolute;right:24px;bottom:20px;color:#fff;font-size:11px;letter-spacing:.18em;font-weight:900}.copy{position:relative}.copy:before{content:"";position:absolute;left:32px;top:32px;width:30px;height:1px;background:#111}.copy h1{letter-spacing:-.065em}.link{transition:.2s}.link:hover{transform:translateX(6px)}
</style>
</head><body>
<main class="poster"><section class="art"><span class="vertical">OFFICIAL EVENT WEBSITE</span><div class="orb o1" data-k="32"></div><div class="orb o2" data-k="-20"></div><div class="orb o3" data-k="46"></div></section><section class="copy"><div class="eyebrow">SMALL EVENT</div><h1>EVENT<br>TITLE</h1><p>一个主视觉、少量核心信息、一个明确外链。</p><div class="facts"><div class="fact"><b>DATE</b><span>00.00</span></div><div class="fact"><b>TIME</b><span>00:00 — 00:00</span></div><div class="fact"><b>VENUE</b><span>会场名称</span></div></div><a class="link">EXTERNAL LINK →</a></section></main>
<script>addEventListener('mousemove',e=>{let x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;document.querySelectorAll('.orb').forEach(o=>{let k=+o.dataset.k;o.style.transform=`translate(${x*k}px,${y*k}px)`})});</script></body></html>
