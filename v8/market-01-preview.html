</details></main><footer><span data-event-name></span> · Powered by OnlyEvent</footer><dialog class="zoom" id="zoom"><button id="closeZoom">关闭 ×</button><img id="zoomImage" alt="放大场地图"></dialog><script type="module">import{getData,mountCommon,img,esc}from'/v8/market-shared.js';
const d=getData(),{ps,cs,$}=mountCommon(d);
if(d.heroImage){$('kvArtwork').innerHTML='<img alt="活动 KV" src="'+esc(d.heroImage)+'">';}
const external=typeof d.ticketUrl==='string'&&/^https:\/\//i.test(d.ticketUrl);
document.querySelectorAll('[data-ticket]').forEach(a=>{a.href=external?d.ticketUrl:'#guide';a.textContent=external?'前往外部购票 ↗':'查看入场指南 ↗';if(external){a.target='_blank';a.rel='noopener noreferrer';}});
const communities=Array.isArray(d.community)?d.community:[];
$('communityLinks').innerHTML=communities.filter(c=>/^https:\/\//i.test(c.url||'')).map(c=>'<a href="'+esc(c.url)+'" target="_blank" rel="noopener noreferrer">'+esc(c.label||c.name||'社群')+' ↗</a>').join('')||'<p class="empty">主办方尚未添加社群入口。</p>';
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let six=current.slice(0,6);
$('randomSix').innerHTML=six.length?six.map(p=>{const c=cs.find(x=>x.id===p.creatorId);return '<a class="tile" href="#products" data-market-record="products" data-market-record-id="'+esc(p.id||'')+'"><div class="tile-visual">'+img(p.image,p.name)+'</div><div class="tile-text"><strong>'+esc(p.name)+'</strong><small>'+esc(c?.name||'')+' · '+esc(p.price||'')+'</small></div></a>'}).join(''):'<p class="empty">暂无可推荐制品。</p>';
let n=0;function draw(){if(!current.length){$('adTitle').textContent='暂无制品';return}const p=current[n];$('adVisual').innerHTML=img(p.image,p.name);$('adTitle').textContent=p.name;$('adMeta').textContent=(cs.find(c=>c.id===p.creatorId)?.name||'')+' · '+(p.price||'');$('adNumber').textContent=(n+1)+' / '+current.length;}
function step(v){n=(n+v+current.length)%current.length;draw()}$('adPrev').onclick=()=>step(-1);$('adNext').onclick=()=>step(1);draw();
const ad=$('ads');let startX=null;ad.addEventListener('touchstart',e=>{startX=e.touches[0]?.clientX??null},{passive:true});ad.addEventListener('touchend',e=>{if(startX===null)return;const dx=(e.changedTouches[0]?.clientX??startX)-startX;if(Math.abs(dx)>45&&current.length>1)step(dx<0?1:-1);startX=null},{passive:true});
const frame=$('adVisual');let downX=null;frame.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;downX=e.clientX});frame.addEventListener('pointerup',e=>{if(downX===null)return;const delta=e.clientX-downX;if(Math.abs(delta)>50&&current.length>1)step(delta<0?1:-1);downX=null});frame.addEventListener('pointercancel',()=>downX=null);
if(current.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{if(!document.hidden)step(1)},5500);
const mobile=matchMedia('(max-width:800px)').matches;
if(mobile&&d.mobileHeroImage){const ov=$('mobileOpening');const art=$('mobileOpeningArt');art.innerHTML='<img src="'+esc(d.mobileHeroImage)+'" alt="活动移动端主视觉">';ov.classList.remove('is-hidden');const close=()=>{ov.classList.add('is-hidden');ov.setAttribute('aria-hidden','true')};$('skipOpening').onclick=close;ov.addEventListener('click',e=>{if(e.target===ov)close()});setTimeout(close,2500)}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&['#creators','#products','#map','#guide'].includes(a.getAttribute('href')))$('directory').open=true;});
