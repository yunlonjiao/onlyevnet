<!doctype html><html lang="zh-CN"><head><title>Market 01 · 国内同人创作展视觉原型</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}img{width:100%;height:100%;object-fit:contain}.tile-visual{background:#f3ecf4;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center}.placeholder{font-size:24px;font-weight:900;padding:25px;text-align:center}.tile-text{padding:15px;display:grid;gap:7px}.tile-text strong{font-size:20px}.tile-text small{opacity:.7}.tile-text p{margin:0}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.tile{min-width:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px}.section-head h2{margin:0 0 28px}.search{padding:15px;border:1px solid;width:100%;max-width:440px;margin-bottom:24px}.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.map-item{background:white;border:1px solid;text-align:left;padding:12px;display:grid;gap:12px}.map-item img{max-height:340px}.empty{opacity:.6}.zoom{max-width:95vw;max-height:95vh;border:0}.zoom img{max-height:75vh}.zoom button{display:block;margin:12px 0 12px auto}@media(max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.maps{grid-template-columns:1fr}.tile-text strong{font-size:16px}} </style><style>body{background:#faf8fc;color:#302536;font-family:"Microsoft YaHei",sans-serif}header{height:75px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:5;border-bottom:1px solid #eacbdc}.brand{font-size:22px;font-weight:1000;letter-spacing:-.06em}nav{display:flex;gap:24px;font-weight:700;font-size:13px}.hero{background:#fee6f2;position:relative;overflow:hidden}.kv{width:100%;height:min(53vw,670px);min-height:400px;display:grid;grid-template-columns:1fr 1fr;gap:0;background:linear-gradient(110deg,#d5f1fb 0 23%,#f7d9ea 23% 100%)}.kv .character{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.character:before,.character:after{content:"";position:absolute;width:55%;aspect-ratio:1;border-radius:50%;background:#ffffff7a}.character:before{left:10%;top:12%}.character:after{right:3%;bottom:0}.kv .character strong{font-size:clamp(80px,14vw,225px);letter-spacing:-.12em;line-height:.8;color:#fff;text-shadow:8px 8px #ec78a6;transform:rotate(-10deg);z-index:1}.hero-copy{display:flex;flex-direction:column;justify-content:center;padding:6vw;z-index:1}.hero-copy h1{font-size:clamp(42px,6vw,95px);letter-spacing:-.075em;line-height:1.12;margin:10px 0 22px;color:#3a2957}.hero-copy p{max-width:440px}.date{font-weight:900;font-size:20px}.cta{display:inline-flex;align-self:flex-start;background:#f75fa0;color:#fff;border-radius:30px;padding:13px 27px;font-weight:800}.ribbon{background:#573676;color:white;padding:15px 5vw;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-weight:700}.wrap{max-width:1220px;margin:auto;padding:0 28px}main section{padding:80px 0}.section-head h2{font-size:clamp(35px,4vw,60px);font-weight:950;letter-spacing:-.07em}.feature{background:#f6d6ec;border-radius:25px;padding:32px;margin:70px 0 0;box-shadow:12px 12px #d6a3c9}.feature-body{background:white;border-radius:20px;display:grid;grid-template-columns:1.2fr 1fr;min-height:320px;overflow:hidden}.feature-art{background:#fde6ba;display:flex;align-items:center;justify-content:center;font-size:100px;font-weight:950}.feature-art img{height:350px}.feature-info{padding:35px;display:flex;flex-direction:column;justify-content:center}.feature-info h3{font-size:40px;margin:12px 0}.feature-info button{align-self:flex-start;border:0;background:#523770;color:white;border-radius:100px;padding:12px 25px;margin-right:9px}.tile{background:white;border-radius:12px;overflow:hidden;box-shadow:0 7px 25px #58376012}.tile-visual{aspect-ratio:3/4}.sponsors{display:flex;gap:22px;flex-wrap:wrap}.sponsors span{padding:20px;background:white}footer{padding:70px 5vw;background:#352642;color:white;margin-top:80px}@media(max-width:700px){header{padding:0 18px;height:65px}nav{gap:9px;font-size:11px;flex-wrap:wrap}.kv{grid-template-columns:1fr;min-height:660px;height:auto}.kv .character{min-height:275px;order:-1}.hero-copy{padding:23px}.hero-copy h1{font-size:46px}.wrap{padding:0 18px}main section{padding:55px 0}.feature{padding:13px;margin:45px 0 0}.feature-body{grid-template-columns:1fr}.feature-art{height:190px}.feature-info{padding:23px}.feature-info h3{font-size:28px}}</style></head><body><header><a href="#top" class="brand">DOUJIN<span style="color:#ef68a4"> / MARKET</span></a><nav><a href="#creators">社团</a><a href="#products">制品</a><a href="#map">地图</a><a href="#guide">观展指南</a></nav></header><div id="top" class="hero"><div class="kv"><div class="hero-copy"><small>DOUJIN CREATOR EVENT</small><h1 data-event-name></h1><p data-description></p><p class="date"><span data-date></span> / <span data-location></span></p><a class="cta" data-ticket href="#guide">入场指南 ↗</a></div><div class="character" id="kvArtwork"><strong>创作<br>集会</strong></div></div></div><div class="ribbon"><span>同人创作展 · 官方信息</span><span>社团资讯　/　作品宣传　/　展位地图</span></div><main class="wrap"><section id="ads" class="feature"><div class="section-head"><h2>制品放送</h2><span>FEATURED GOODS</span></div><div class="feature-body"><div class="feature-art" id="adVisual"></div><div class="feature-info"><small>CREATOR PICK <span id="adNumber"></span></small><h3 id="adTitle"></h3><p id="adMeta"></p><p><button id="adPrev" aria-label="上一件制品">←</button><button id="adNext" aria-label="下一件制品">→</button></p></div></div></section><section id="creators"><div class="section-head"><h2>参展社团</h2><span>CIRCLES</span></div><input id="search" class="search" type="search" placeholder="搜索社团、制品、标签、摊位号" aria-label="搜索社团和制品"><div id="creatorList" class="tiles"></div></section><section id="products"><div class="section-head"><h2>作品与制品</h2><span>WORKS & GOODS</span></div><div id="productList" class="tiles"></div></section><section id="map"><div class="section-head"><h2>场地图</h2><span>MAP</span></div><div class="maps" id="mapList"></div></section><section id="news"><div class="section-head"><h2>最新消息</h2><span>NEWS</span></div><div id="newsList"></div></section><section id="guide"><div class="section-head"><h2>观展指南</h2><span>GUIDE</span></div><p id="guideText"></p></section><section id="sponsors"><div class="section-head"><h2>合作伙伴</h2><span>SPONSORS</span></div><div id="sponsorList" class="sponsors"></div></section></main><footer>OnlyEvent · CREATOR MARKET 01 / 原型</footer><dialog class="zoom" id="zoom"><button id="closeZoom">关闭 ×</button><img id="zoomImage" alt="放大场地图"></dialog><script type="module">import{getData,mountCommon,img}from'/v8/market-shared.js';const d=getData(),{ps,cs,$}=mountCommon(d);if(d.heroImage){$('kvArtwork').innerHTML='<img alt="活动宣传主视觉" src="'+d.heroImage+'">'}let n=0;function draw(){if(!ps.length){$('adTitle').textContent='暂无制品';return}const p=ps[n];$('adVisual').innerHTML=img(p.image,p.name);$('adTitle').textContent=p.name;$('adMeta').textContent=(cs.find(c=>c.id===p.creatorId)?.name||'')+'　'+(p.price||'');$('adNumber').textContent=(n+1)+' / '+ps.length}function shift(v){n=(n+v+ps.length)%ps.length;draw()}$('adPrev').onclick=()=>shift(-1);$('adNext').onclick=()=>shift(1);draw();if(ps.length>1)setInterval(()=>{if(!document.hidden)shift(1)},5000);</script></body></html>
