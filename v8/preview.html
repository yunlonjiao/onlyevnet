<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17171c">
<title>预览 · OnlyEvent</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  *{box-sizing:border-box}
  .pv-bar{position:fixed;left:0;right:0;top:0;z-index:10;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#17171c;color:#fff;font:600 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))}
  .pv-dot{width:8px;height:8px;border-radius:50%;background:#45d483;flex:none;box-shadow:0 0 0 4px rgba(69,212,131,.16)}
  .pv-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .pv-tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.08em;color:#bdbdc8;border:1px solid #3a3a44;border-radius:999px;padding:4px 8px}
  .pv-back{margin-left:auto;flex:none;border:0;border-radius:999px;background:#fff;color:#17171c;font:800 12px/1 inherit;padding:9px 14px;cursor:pointer}
  #previewFrame{position:fixed;left:0;right:0;bottom:0;top:calc(52px + env(safe-area-inset-top));width:100%;height:calc(100% - 52px - env(safe-area-inset-top));border:0;display:block;background:#fff}
  .fail{position:fixed;top:calc(72px + env(safe-area-inset-top));left:0;right:0;font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#555;padding:24px;display:none;text-align:center}
  @media(min-width:821px){.pv-bar{padding-left:20px;padding-right:20px}.pv-name{font-size:14px}}
body.embed .pv-bar{display:none}
  body.embed #previewFrame{top:0;height:100%}
</style>
</head>
<body>
<header class="pv-bar">
  <i class="pv-dot" aria-hidden="true"></i>
  <b class="pv-name" id="pvName">活动网站预览</b>
  <span class="pv-tag">预览中</span>
  <button type="button" class="pv-back" id="pvBack">返回编辑</button>
</header>
<iframe id="previewFrame" title="活动网站预览" allow="clipboard-write"></iframe>
<p class="fail" id="previewFail">预览加载失败。请点右上角「返回编辑」，重新点「预览」。</p>
<script type="module">
  import {getTemplate} from '/v8/templates/registry.js?v=8.558.0';
  const query = new URLSearchParams(location.search);
  if (query.get('embed') === '1') document.body.classList.add('embed');
  const template = query.get('template') || '08-birthday';
  const project = query.get('project') || 'default';
  const frame = document.getElementById('previewFrame');
  const fail = document.getElementById('previewFail');
  const nameEl = document.getElementById('pvName');
  const backEl = document.getElementById('pvBack');
  const stateKey = 'oe-preview-state:' + template + ':' + project;

  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(stateKey) || '{}') || {}; } catch (e) {}
  const tpl = getTemplate(template);
  const state = { ...(structuredClone(tpl?.defaults || {})), ...saved, templateId: template, projectId: project };
  if (query.get('embed') === '1') state.entryAnimation = { ...(state.entryAnimation || {}), enabled: false };
  const eventName = String(state.eventName || state.name || '').trim();
  nameEl.textContent = eventName || '活动网站预览';

  backEl.addEventListener('click', () => {
    try { window.close(); } catch (e) {}
    setTimeout(() => {
      if (!window.closed) {
        location.href = '/v8/?template=' + encodeURIComponent(template) + '&project=' + encodeURIComponent(project);
      }
    }, 180);
  });

  let sent = false;
  const timer = setTimeout(() => { if (!sent) fail.style.display = 'block'; }, 12000);

  frame.src = '/v8/render.html?template=' + encodeURIComponent(template) + '&project=' + encodeURIComponent(project);

  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow) return;
    const m = event.data || {};
    if (m.type !== 'OE_READY' || sent) return;
    sent = true;
    clearTimeout(timer);
    frame.contentWindow.postMessage({ type: 'OE_INIT_STATE', state, page: 'home', mode: 'preview' }, location.origin);
  });
</script>
</body>
</html>
