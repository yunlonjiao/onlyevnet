<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnlyEvent Studio v8</title>
  <link rel="stylesheet" href="/v8/styles.css?v=8.21.0">
</head>
<body>
  <header class="studio-topbar">
    <div class="brand-zone">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
      <div class="brand-copy">
        <div class="brand">OnlyEvent <strong>Studio</strong></div>
        <div class="project-meta"><span class="project-dot"></span><b>IP ONLY</b><span>STARDUST ONLY 2026</span></div>
      </div>
    </div>

    <div class="top-actions">
      <div class="action-group device-group" aria-label="设备预览">
        <button id="deviceDesktopBtn" class="active" data-device="desktop" type="button" title="桌面画布"><span class="action-icon">▭</span><span>桌面</span></button>
        <button id="deviceMobileBtn" data-device="mobile" type="button" title="手机画布"><span class="action-icon">▯</span><span>手机</span></button>
      </div>
      <div class="action-group preview-group">
        <button id="previewBtn" type="button" title="查看发布效果"><span class="action-icon">◉</span><span id="previewLabel">预览</span></button>
      </div>
      <div class="action-separator"></div>
      <div class="action-group history-group">
        <button id="undoBtn" class="icon-button" type="button" disabled title="撤销">↶</button>
        <button id="redoBtn" class="icon-button" type="button" disabled title="重做">↷</button>
      </div>
      <button id="publishBtn" class="primary" type="button"><span>发布</span><span class="publish-arrow">↗</span></button>
    </div>
  </header>

  <main class="studio-shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="workspace-label">工作区</span>
        <span class="workspace-template">IP ONLY</span>
      </div>

      <nav class="workspace-tabs" aria-label="编辑工作区">
        <button type="button" class="active" data-workspace="pages"><span>▤</span><b>页面</b></button>
        <button type="button" data-workspace="content"><span>◆</span><b>内容</b></button>
        <button type="button" data-workspace="modules"><span>◫</span><b>模块</b></button>
      </nav>

      <section class="workspace-panel active" data-workspace-panel="pages">
        <div class="workspace-panel-head"><b>页面</b><small>网站结构</small></div>
        <nav class="page-nav">
          <button data-page="home" type="button"><span class="nav-icon">⌂</span><span>首页</span></button>
          <button data-page="booths" data-module-page="booths" type="button"><span class="nav-icon">⌘</span><span>摊位详情</span></button>
          <button data-page="activities" data-module-page="activities" type="button"><span class="nav-icon">◷</span><span>活动详情</span></button>
          <button data-page="guide" type="button"><span class="nav-icon">i</span><span>观展指南</span></button>
        </nav>
      </section>

      <section class="workspace-panel" data-workspace-panel="content" hidden>
        <div class="workspace-panel-head"><b>内容库</b><small>选择内容类型</small></div>
        <div class="content-managers">
          <button type="button" data-content-manager="tickets"><span>票务</span><b data-content-count="tickets">0</b></button>
          <button type="button" data-content-manager="highlights"><span>特别企划</span><b data-content-count="highlights">0</b></button>
          <button type="button" data-content-manager="booths"><span>摊位</span><b data-content-count="booths">0</b></button>
          <button type="button" data-content-manager="participation"><span>活动参与</span><b data-content-count="participation">0</b></button>
          <button type="button" data-content-manager="schedule"><span>当天日程</span><b data-content-count="schedule">0</b></button>
          <button type="button" data-content-manager="guests"><span>嘉宾</span><b data-content-count="guests">0</b></button>
                    <button type="button" data-content-manager="guide"><span>观展指南</span><b data-content-count="guide">0</b></button>
          <button type="button" data-content-manager="updates"><span>重要更新</span><b data-content-count="updates">0</b></button>
          <button type="button" data-content-manager="socialLinks"><span>社群入口</span><b data-content-count="socialLinks">0</b></button>
          <button type="button" data-content-manager="sponsors"><span>赞助支持</span><b data-content-count="sponsors">0</b></button>
        </div>
        <div class="sidebar-content-list" id="contentListPanel">
          <div class="sidebar-content-empty">选择上方内容类型后，在这里管理具体项目。</div>
        </div>
      </section>

      <section class="workspace-panel" data-workspace-panel="modules" hidden>
        <div class="workspace-panel-head"><b>模块</b><small>控制首页可选内容</small></div>
        <div class="module-switches">
          <label><span>滚动公告</span><input type="checkbox" data-module="ribbon"></label>
          <label><span>特别企划</span><input type="checkbox" data-module="highlights"></label>
          <label><span>嘉宾</span><input type="checkbox" data-module="guests"></label>
          <label><span>自由行（活动参与）</span><input type="checkbox" data-module="freewalk"></label>
          <label><span>痛车（活动参与）</span><input type="checkbox" data-module="itasha"></label>
          <label><span>社群</span><input type="checkbox" data-module="community"></label>
          <label><span>赞助</span><input type="checkbox" data-module="sponsors"></label>
        </div>
      </section>
    </aside>

    <section class="canvas-wrap">
      <div class="canvas-toolbar">
        <div class="save-status"><span class="status-dot"></span><span id="saveState">已保存</span></div>
        <div class="canvas-title"><span class="canvas-page-dot"></span><b>首页</b><span>/</span><span id="canvasDeviceLabel">桌面画布</span></div>
        <div class="canvas-hint"></div>
      </div>
      <div class="canvas-stage">
        <div class="canvas" id="canvas"></div>
      </div>
    </section>

    <aside class="inspector" id="inspector">
      <div class="inspector-header">
        <div><span class="inspector-kicker">属性</span><b>未选择内容</b></div>
        <span class="inspector-status"><i></i>自动保存</span>
      </div>
      <div class="inspector-body">
        <div class="inspector-empty">
          <div class="empty-visual"><span></span><span></span><span></span></div>
          <b>从画布或左侧内容库选择内容</b>
        </div>
      </div>
    </aside>
  </main>

  <input id="imageInput" type="file" accept="image/*" hidden>
  <dialog id="imageCropDialog" class="image-crop-dialog">
    <div class="crop-shell">
      <div class="crop-head">
        <div><b>裁剪图片</b><span id="cropSlotLabel">图片</span></div>
        <button id="cropClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="crop-stage" id="cropStage"><img id="cropImage" alt=""></div>
      <div class="crop-foot">
        <div class="crop-tools">
          <button id="cropRotateLeft" type="button">↶ 90°</button>
          <button id="cropReset" type="button">重置</button>
          <span id="cropRatioLabel">推荐比例</span>
        </div>
        <div class="crop-actions">
          <button id="cropCancel" type="button">取消</button>
          <button id="cropApply" type="button" class="primary">应用裁剪</button>
        </div>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/v8/app.js?v=8.21.0"></script>
</body>
</html>
