<!doctype html>
<!-- v8.30 page-content preview -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnlyEvent Studio v8</title>
  <link rel="stylesheet" href="/v8/styles.css?v=8.30.0">
</head>
<body>
  <header class="studio-topbar">
    <div class="brand-zone">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
      <div class="brand-copy">
        <div class="brand">OnlyEvent <strong>Studio</strong></div>
        <div class="project-meta"><span class="project-dot"></span><b>IP ONLY</b><span>STARDUST ONLY 2026</span></div>
      </div>
    </div>

    <div class="top-actions">
      <div class="action-group device-group" aria-label="设备预览">
        <button id="deviceDesktopBtn" class="active" data-device="desktop" type="button" title="桌面画布"><span class="action-icon">▭</span><span>桌面</span></button>
        <button id="deviceMobileBtn" data-device="mobile" type="button" title="手机画布"><span class="action-icon">▯</span><span>手机</span></button>
      </div>
      <div class="action-group preview-group">
        <button id="previewBtn" type="button" title="查看发布效果"><span class="action-icon">◉</span><span id="previewLabel">预览</span></button>
      </div>
      <div class="action-separator"></div>
      <div class="action-group history-group">
        <button id="undoBtn" class="icon-button" type="button" disabled title="撤销">↶</button>
        <button id="redoBtn" class="icon-button" type="button" disabled title="重做">↷</button>
      </div>
      <button id="publishBtn" class="primary" type="button"><span>发布</span><span class="publish-arrow">↗</span></button>
    </div>
  </header>

  <main class="studio-shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="workspace-label">工作区</span>
        <span class="workspace-template">IP ONLY</span>
      </div>

      <section class="workspace-panel active page-workspace" data-workspace-panel="pages">
        <div class="workspace-panel-head"><b>页面</b></div>
        <nav class="page-nav page-tree">
          <div class="page-tree-row is-fixed">
            <button data-page="home" type="button"><span class="nav-icon">⌂</span><span>首页</span></button>
          </div>
          <div class="page-tree-row" data-page-row="booths">
            <button data-page="booths" type="button"><span class="nav-icon">⌘</span><span>摊位</span></button>
            <label class="page-inline-switch" title="显示摊位页面"><input type="checkbox" data-module="booths" aria-label="显示摊位页面"><i></i></label>
          </div>
          <div class="page-tree-row" data-page-row="activities">
            <button data-page="activities" type="button"><span class="nav-icon">◷</span><span>活动</span></button>
            <label class="page-inline-switch" title="显示活动页面"><input type="checkbox" data-module="activities" aria-label="显示活动页面"><i></i></label>
          </div>
          <div class="page-tree-row" data-page-row="guide">
            <button data-page="guide" type="button"><span class="nav-icon">i</span><span>观展指南</span></button>
            <label class="page-inline-switch" title="显示观展指南页面"><input type="checkbox" data-module="guide" aria-label="显示观展指南页面"><i></i></label>
          </div>
          <div class="page-tree-row" data-page-row="freewalk">
            <button data-page="freewalk" type="button"><span class="nav-icon">◇</span><span>COS / 自由行</span></button>
            <label class="page-inline-switch" title="显示 COS / 自由行页面"><input type="checkbox" data-module="freewalk" aria-label="显示 COS / 自由行页面"><i></i></label>
          </div>
          <div class="page-tree-row" data-page-row="itasha">
            <button data-page="itasha" type="button"><span class="nav-icon">◇</span><span>痛车展示</span></button>
            <label class="page-inline-switch" title="显示痛车展示页面"><input type="checkbox" data-module="itasha" aria-label="显示痛车展示页面"><i></i></label>
          </div>
        </nav>

        <div class="page-content-block">
          <div class="page-content-title"><b id="pageContentTitle">首页内容</b></div>
          <div class="page-content-nav" id="pageContentNav"></div>
          <div class="sidebar-content-list" id="contentListPanel">
            <div class="sidebar-content-empty">选择页面内容进行管理。</div>
          </div>
        </div>
      </section>

    </aside>

    <section class="canvas-wrap">
      <div class="canvas-toolbar">
        <div class="save-status"><span class="status-dot"></span><span id="saveState">已保存</span></div>
        <div class="canvas-title"><span class="canvas-page-dot"></span><b>首页</b><span>/</span><span id="canvasDeviceLabel">桌面画布</span></div>
        <div class="canvas-hint"></div>
      </div>
      <div class="canvas-stage">
        <div class="canvas" id="canvas"></div>
      </div>
    </section>

    <aside class="inspector" id="inspector">
      <div class="inspector-header">
        <div><span class="inspector-kicker">属性</span><b>未选择内容</b></div>
        <span class="inspector-status"><i></i>自动保存</span>
      </div>
      <div class="inspector-body">
        <div class="inspector-empty">
          <div class="empty-visual"><span></span><span></span><span></span></div>
          <b>从画布或左侧内容库选择内容</b>
        </div>
      </div>
    </aside>
  </main>

  <input id="imageInput" type="file" accept="image/*" hidden>
  <dialog id="imageCropDialog" class="image-crop-dialog">
    <div class="crop-shell">
      <div class="crop-head">
        <div><b>选择图片的截取位置</b><span id="cropSlotLabel">图片</span></div>
        <button id="cropClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="crop-workspace">
        <section class="crop-pane crop-pane-source">
          <div class="crop-pane-label">截取展示区域</div>
          <div class="crop-stage" id="cropStage"><img id="cropImage" alt=""></div>
        </section>
        <section class="crop-pane crop-pane-preview">
          <div class="crop-pane-label">最终展示效果</div>
          <div class="crop-preview-shell" id="cropPreviewShell">
            <canvas id="cropPreviewCanvas" aria-label="裁剪效果预览"></canvas>
          </div>
          <div class="crop-preview-meta"><b id="cropRatioLabel">推荐比例</b><span>实时预览</span></div>
        </section>
      </div>
      <div class="crop-foot">
        <div class="crop-tools">
          <button id="cropRotateLeft" type="button">↶ 90°</button>
          <button id="cropReset" type="button">重置</button>
        </div>
        <div class="crop-actions">
          <button id="cropCancel" type="button">取消</button>
          <button id="cropApply" type="button" class="primary">确定</button>
        </div>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/v8/app.js?v=8.30.0"></script>
</body>
</html>
