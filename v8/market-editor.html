<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnlyEvent Studio · 同人创作展</title><style>
*{box-sizing:border-box}body{margin:0;color:#23232d;background:#f5f5f9;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}header{height:64px;background:#fff;border-bottom:1px solid #e6e6ed;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}header b{font-size:17px}header .actions{display:flex;gap:8px;align-items:center}button{border:1px solid #dcdce6;background:#fff;padding:9px 14px;border-radius:8px;font-weight:600}button.primary{background:#25252e;color:#fff;border-color:#25252e}button:hover{border-color:#999}header .state{color:#808090;font-size:12px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;height:calc(100vh - 64px)}aside{background:#fff;overflow:auto;padding:18px;border-right:1px solid #e6e6ed}aside.right{border-right:0;border-left:1px solid #e6e6ed}.nav{display:grid;gap:5px;margin-top:20px}.nav button{display:flex;text-align:left;border:0;background:transparent;padding:12px;align-items:center}.nav button.active{background:#f0edff;color:#5944bb}.canvas{padding:18px;min-width:0;overflow:auto}.canvas-frame{height:100%;max-width:100%;background:#fff;border:1px solid #e3e3eb;border-radius:11px;overflow:hidden;box-shadow:0 8px 32px #00000008;margin:auto;transition:width .2s}.canvas-frame.mobile{width:390px}iframe{border:0;width:100%;height:100%}h3{margin:0 0 14px;font-size:18px}label{display:grid;gap:5px;margin:0 0 14px;font-size:12px;font-weight:650;color:#555}input,textarea,select{width:100%;border:1px solid #dcdce6;padding:10px;border-radius:7px;background:#fff;color:#222;font-size:14px}textarea{min-height:86px;resize:vertical}.group{display:grid;gap:6px;margin-bottom:18px}.group>strong{font-size:13px}.field-help{font-size:12px;color:#838391;margin:8px 0}.list-row{display:flex;gap:7px;align-items:center;border-bottom:1px solid #ededf4;padding:8px 0}.list-row>button:first-child{flex:1;text-align:left;border:0;padding:7px;background:#f7f7fa}.list-row .danger{color:#a83b48}.image-preview{max-width:100%;max-height:130px;object-fit:contain;background:#f2f2f4;border-radius:5px}.small{font-size:11px;color:#81818f}.empty{color:#858595}.toolbar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}#previewMode.active{background:#e9e7fb;color:#5142a6}.error{color:#bd2744;font-size:12px;white-space:pre-wrap}.footer-note{border-top:1px solid #eee;padding-top:15px;color:#90909a;font-size:11px}@media(max-width:950px){.layout{grid-template-columns:190px minmax(0,1fr)}aside.right{position:fixed;right:0;top:64px;bottom:0;width:min(330px,85vw);z-index:5;box-shadow:-10px 0 30px #0001}.canvas{padding:8px}}@media(max-width:600px){header{height:auto;min-height:64px;flex-wrap:wrap;padding:9px}.layout{height:calc(100vh - 100px);grid-template-columns:100px 1fr}.nav button{font-size:12px;padding:10px 4px}aside{padding:8px}aside.right{top:90px}.canvas{padding:5px}.canvas-frame.mobile{width:100%}}
</style></head><body><header><div><a href="/admin/" style="color:#888;text-decoration:none;font-size:12px">← 返回活动</a>　<b>OnlyEvent Studio · 同人创作展</b></div><div class="actions"><span class="state" id="status">准备就绪</span><button id="undo">撤销</button><button id="redo">重做</button><button id="desktop">桌面</button><button id="mobile">手机</button><button id="previewMode">预览</button><button class="primary" id="save">保存</button></div></header><div class="layout"><aside><b>页面与内容</b><div class="nav" id="nav"></div><p class="footer-note">原型编辑器：数据仅保存在当前浏览器。正式发布与账号同步尚未接入。</p></aside><main class="canvas"><div class="canvas-frame" id="frameBox"><iframe id="previewFrame" title="活动网站实时预览" src="/v8/market-01-preview.html?studio=1"></iframe></div></main><aside class="right"><h3 id="panelTitle">活动信息</h3><div id="panel"></div></aside></div>
<script type="module">
import {sample,getData,esc} from '/v8/market-shared.js';
const KEY='onlyevent-creator-fair-demo', $=id=>document.getElementById(id),sections=[['basic','基本信息'],['images','主视觉与开场'],['ticket','入场票'],['creators','社团管理'],['products','制品管理'],['maps','场地图'],['news','公告'],['community','社群'],['sponsors','赞助'],['guide','观展指南']];
let d=structuredClone(getData()),screen='basic',picked=-1,history=[],future=[],isPreview=false,saveTimer=null;
function snapshot(){history.push(structuredClone(d));if(history.length>60)history.shift();future=[]}
function commit(){try{localStorage.setItem(KEY,JSON.stringify(d));$('status').textContent='已保存 · '+new Date().toLocaleTimeString();$('previewFrame').contentWindow.location.reload()}catch(e){$('status').textContent='保存失败：浏览器存储空间不足';return}refreshButtons()}
function defer(){clearTimeout(saveTimer);$('status').textContent='保存中…';saveTimer=setTimeout(commit,180)}
function refreshButtons(){$('undo').disabled=!history.length;$('redo').disabled=!future.length}
function field(label,path,{multiline=false,type='text',placeholder=''}={}){const value=path.split('.').reduce((x,k)=>x?.[k],d)??'';return '<label>'+esc(label)+(multiline?'<textarea data-path="'+esc(path)+'" placeholder="'+esc(placeholder)+'">'+esc(value)+'</textarea>':'<input data-path="'+esc(path)+'" type="'+type+'" value="'+esc(value)+'" placeholder="'+esc(placeholder)+'">')+'</label>'}
function media(label,path){const value=path.split('.').reduce((x,k)=>x?.[k],d)||'';return '<div class="group"><strong>'+esc(label)+'</strong>'+(value?'<img class="image-preview" src="'+esc(value)+'" alt="当前图片">':'')+field('图片地址',path,{placeholder:'支持上传图片或输入 https 图片链接'})+'<input type="file" accept="image/*" data-upload="'+esc(path)+'"><small class="small">建议压缩图片；本地存储限制因浏览器而异。</small></div>'}
function setValue(path,value){const parts=path.split('.');let current=d;for(const k of parts.slice(0,-1))current=current[k];current[parts.at(-1)]=value;}
function listPanel(key,title){const items=d[key]||[];const fields=key==='creators'?[['社团名称','name'],['摊位号','booth'],['社团简介','description'],['标签（逗号分隔）','tags'],['摊宣图片','image']]:key==='products'?[['制品名称','name'],['所属社团 ID','creatorId'],['价格','price'],['说明','description'],['标签（逗号分隔）','tags'],['制品图片','image']]:key==='maps'?[['地图名称','title'],['地图图片','image']]:key==='news'?[['发布日期','date'],['公告标题','title']]:key==='community'?[['显示名称','label'],['社群链接','url']]:[['赞助商名称','name'],['Logo 图片','image']];
let html='<div class="toolbar"><button data-add="'+key+'">+ 添加'+title+'</button></div>';items.forEach((x,i)=>html+='<div class="list-row"><button data-pick="'+i+'">'+esc(x.name||x.title||x.label||x.booth||'记录 '+(i+1))+'</button><button class="danger" data-remove="'+i+'">删除</button></div>');
if(picked>=0&&items[picked]){const x=items[picked];html+='<hr><h3>编辑'+title+' '+(picked+1)+'</h3>';for(const [label,k] of fields){if(k==='image')html+=media(label,key+'.'+picked+'.'+k);else if(k==='tags')html+='<label>'+label+'<input data-tags="'+key+'.'+picked+'.tags" value="'+esc((x.tags||[]).join(', '))+'"></label>';else html+=field(label,key+'.'+picked+'.'+k,{multiline:k==='description'});}if(key==='products'){html+='<label>关联社团<select data-path="products.'+picked+'.creatorId"><option value="">未关联</option>'+d.creators.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===x.creatorId?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label>'}}
return html}
function render(){ $('nav').innerHTML=sections.map(([k,label])=>'<button class="'+(screen===k?'active':'')+'" data-section="'+k+'">'+label+'</button>').join('');$('panelTitle').textContent=sections.find(x=>x[0]===screen)?.[1]||'';
let html='';
if(screen==='basic')html=field('活动名称','eventName')+field('活动简介','description',{multiline:true})+field('活动日期','date')+field('地址','location');
if(screen==='images')html=media('桌面宣传 KV','heroImage')+media('手机专用开场 KV','mobileHeroImage');
if(screen==='ticket')html=field('外部购票地址','ticketUrl',{placeholder:'https://…'})+'<p class="field-help">没有购票链接时，游客端显示入场指南。</p>';
if(['creators','products','maps','news','community','sponsors'].includes(screen))html=listPanel(screen,$('panelTitle').textContent);
if(screen==='guide')html=field('观展指南正文','guide',{multiline:true});
$('panel').innerHTML=html;refreshButtons();}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-section]');if(!b)return;screen=b.dataset.section;picked=-1;render()});
$('panel').addEventListener('click',e=>{const add=e.target.closest('[data-add]'),del=e.target.closest('[data-remove]'),pick=e.target.closest('[data-pick]');if(add){const key=add.dataset.add;snapshot();d[key]??=[];const item={id:'item-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),name:'新项目',title:'新项目',label:'新项目',tags:[]};d[key].push(item);picked=d[key].length-1;defer();render()}if(del){snapshot();d[screen].splice(Number(del.dataset.remove),1);picked=-1;defer();render()}if(pick){picked=Number(pick.dataset.pick);render()}});
$('panel').addEventListener('focusin',e=>{if(e.target.matches('[data-path],[data-tags]')&&!e.target.dataset.checkpoint){snapshot();e.target.dataset.checkpoint='1';refreshButtons()}});
$('panel').addEventListener('input',e=>{const t=e.target;if(t.matches('[data-path]')){setValue(t.dataset.path,t.value);defer()}else if(t.matches('[data-tags]')){setValue(t.dataset.tags,t.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean));defer()}});
$('panel').addEventListener('change',async e=>{const t=e.target;if(t.matches('[data-path]')){setValue(t.dataset.path,t.value);defer()}if(t.matches('[data-upload]')&&t.files?.[0]){const f=t.files[0];if(f.size>1100000){$('status').textContent='图片过大，请先压缩到 1MB 内';return}snapshot();const reader=new FileReader();reader.onload=()=>{setValue(t.dataset.upload,reader.result);defer();render()};reader.readAsDataURL(f)}});
$('undo').onclick=()=>{if(!history.length)return;future.push(structuredClone(d));d=history.pop();defer();render()};$('redo').onclick=()=>{if(!future.length)return;history.push(structuredClone(d));d=future.pop();defer();render()};
$('desktop').onclick=()=>$('frameBox').classList.remove('mobile');$('mobile').onclick=()=>$('frameBox').classList.add('mobile');
$('save').onclick=commit;
$('previewMode').onclick=()=>{isPreview=!isPreview;$('previewMode').classList.toggle('active',isPreview);document.querySelectorAll('aside').forEach(n=>n.style.display=isPreview?'none':'');document.querySelector('.layout').style.gridTemplateColumns=isPreview?'1fr':'';$('frameBox').style.width=isPreview?'100%':''};
render();
</script></body></html>
