<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live 舞台时间表</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:#111;font-family:Arial,"Noto Sans SC",sans-serif}button{font:inherit}:root{--red:#dc3d32;--blue:#2448b8}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.top{border-bottom:2px solid #111}.top .wrap{height:64px;display:grid;grid-template-columns:1fr auto;align-items:center}.brand{font-weight:950;letter-spacing:-.03em}.stamp{background:var(--red);color:#fff;padding:9px 12px;font-size:11px}.hero{padding:48px 0 30px}.hero-grid{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:end}.hero h1{font-size:clamp(64px,8vw,112px);line-height:.78;letter-spacing:-.075em;margin:0}.hero p{color:#666;max-width:620px;line-height:1.7}.cover-tile{height:240px;background:url("https://images.unsplash.com/photo-1771875797345-958779570e66?auto=format&fit=crop&q=82&w=2400") center/cover;position:relative}.cover-tile:after{content:"LIVE / STAGE / 2026";position:absolute;left:12px;bottom:12px;background:#fff;padding:6px 8px;font-size:10px;font-weight:900}.daybar{display:flex;gap:0;border-top:2px solid #111;border-bottom:2px solid #111}.day{flex:1;background:transparent;border:0;border-right:1px solid #111;padding:14px;cursor:pointer;font-weight:900}.day:last-child{border-right:0}.day.on{background:var(--blue);color:#fff}.schedule{padding:34px 0 70px}.datebox{display:grid;grid-template-columns:230px 1fr;gap:28px}.datecol{border-right:2px solid #111;padding-right:22px}.datecol small{font-weight:900}.datecol .big{font-size:78px;font-weight:950;line-height:.9;margin:8px 0}.timeline{border-top:2px solid #111}.event{display:grid;grid-template-columns:110px 130px 1fr 90px;gap:14px;padding:18px 0;border-bottom:1px solid #111}.time{font-size:24px;font-weight:950}.stage{font-size:10px;color:var(--red);font-weight:900}.status{font-size:10px;font-weight:900}.event h3{margin:0 0 4px;font-size:19px}.event p{margin:0;color:#666}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.legend div{border:1px solid #111;padding:14px}.legend b{display:block;margin-bottom:4px}.footer{background:#111;color:#aaa;padding:34px 0}@media(max-width:800px){.hero-grid{grid-template-columns:1fr}.datebox{grid-template-columns:1fr}.datecol{border-right:0;border-bottom:2px solid #111;padding-bottom:18px}.event{grid-template-columns:80px 1fr 70px}.stage{display:none}.daybar{overflow:auto}.day{min-width:140px}}@media(max-width:520px){.hero h1{font-size:62px}.cover-tile{height:180px}.event{grid-template-columns:72px 1fr}.status{display:none}.legend{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="wrap"><div class="brand">TIME TABLE / 2026</div><span class="stamp">LIVE PROGRAM</span></div></header>
<section class="hero"><div class="wrap hero-grid"><div><h1>TIME<br>TABLE</h1><p>按日期和舞台查看所有节目。时间、舞台与状态是这套页面的核心。</p></div><div class="cover-tile"></div></div></section>
<div class="wrap daybar"><button class="day on" data-day="all">ALL DAYS</button><button class="day" data-day="1">DAY 01</button><button class="day" data-day="2">DAY 02</button><button class="day" data-day="3">DAY 03</button></div>
<section class="schedule"><div class="wrap datebox"><aside class="datecol"><small id="label">ALL DAYS</small><div class="big" id="num">18—20</div><b>MAY / 2026</b></aside><div><div class="timeline" id="timeline"></div><div class="legend"><div><b>STAGE A</b><span>Main Hall</span></div><div><b>STAGE B</b><span>Talk Room</span></div><div><b>STAGE C</b><span>Special Area</span></div></div></div></div></section><footer class="footer"><div class="wrap">TIME TABLE · Organizer · Contact</div></footer>
<script>const d={1:{l:'FRIDAY / DAY 01',n:'18',e:[['10:30','STAGE A','Opening Program','活动介绍与开场','FREE'],['12:00','STAGE B','Guest Talk','Guest 01 / 02','DETAILS'],['14:10','STAGE A','Live Performance','Artist 01 / 02','DETAILS']]},2:{l:'SATURDAY / DAY 02',n:'19',e:[['11:00','STAGE B','Creator Talk','Creator 01 / 02','DETAILS'],['15:00','STAGE C','Special Program','联动企划','LIMITED'],['19:20','STAGE A','Night Live','Artist 03 / 04','DETAILS']]},3:{l:'SUNDAY / DAY 03',n:'20',e:[['11:30','STAGE A','Guest Special','Guest 03 / 04','DETAILS'],['16:00','STAGE B','Final Talk','Closing Session','FREE'],['20:00','STAGE A','Closing Live','Final Performance','DETAILS']]}};const t=document.querySelector('#timeline'),lab=document.querySelector('#label'),num=document.querySelector('#num');function render(k){const ks=k==='all'?['1','2','3']:[k];lab.textContent=k==='all'?'ALL DAYS':d[k].l;num.textContent=k==='all'?'18—20':d[k].n;t.innerHTML=ks.flatMap(x=>d[x].e.map(e=>'<article class="event"><span class="time">'+e[0]+'</span><span class="stage">'+e[1]+'</span><div><h3>'+e[2]+'</h3><p>'+e[3]+'</p></div><span class="status">'+e[4]+'</span></article>')).join('')}document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{document.querySelectorAll('.day').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.day)});render('all');</script></body></html>
