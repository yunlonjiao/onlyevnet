<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live / 舞台活动</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,"Noto Sans SC","Noto Sans JP",system-ui,sans-serif;color:#111}a{text-decoration:none;color:inherit}button,input{font:inherit}.wrap{max-width:1220px;margin:auto;padding:0 28px}.muted{color:#72757f}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.placeholder{background:linear-gradient(135deg,#e9ebf0,#d9dde5);position:relative;overflow:hidden}.placeholder:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 20px,rgba(255,255,255,.35) 20px 21px)}@media(max-width:760px){.wrap{padding:0 16px}}
body{background:#fff}.hero{min-height:75vh;background:#161616;color:white;display:flex;align-items:end}.hero .wrap{width:100%;padding-bottom:50px}.hero h1{font-size:clamp(70px,12vw,160px);line-height:.74;margin:0}.daynav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:2px solid #111}.daynav .wrap{height:66px;display:flex;gap:8px;align-items:center}.daybtn{border:1px solid #111;background:#fff;padding:10px 16px;border-radius:999px}.daybtn.on{background:#111;color:#fff}.schedule{padding:58px 0}.schedulegrid{display:grid;grid-template-columns:160px 1fr;gap:0}.timecol{font-size:28px;font-weight:950;border-top:1px solid #111;padding:18px 0}.eventscol{border-top:1px solid #111;padding:18px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}.eventbox{border:1px solid #111;padding:18px;min-height:110px;transition:.25s}.eventbox:hover{background:#111;color:#fff}.stagehead{display:grid;grid-template-columns:160px 1fr 1fr;margin-bottom:10px}.stagehead b{padding:8px 0}.stagehead b:not(:first-child){text-align:center}@media(max-width:760px){.schedulegrid{grid-template-columns:90px 1fr}.eventscol{grid-template-columns:1fr}.stagehead{display:none}}
</style>
<style id="hf-polish">
.hero{position:relative;overflow:hidden}.hero:after{content:"TIMETABLE";position:absolute;right:-2vw;top:8%;font-size:18vw;font-weight:950;color:rgba(255,255,255,.04);letter-spacing:-.08em}.head .wrap{position:relative;z-index:2}.track{position:relative}.event{background:#fff}.event:hover{background:#111;color:#fff}.event:hover .muted{color:#aaa}.clock{font-family:monospace}.slot{transition:opacity .35s}.slot.on .event{box-shadow:10px 10px 0 #111}
</style>
</head><body>
<section class="hero"><div class="wrap"><div class="eyebrow">LIVE FESTIVAL</div><h1>EVENT<br>TIMETABLE</h1><p>00.00 — 00.00 / VENUE NAME</p></div></section><nav class="daynav"><div class="wrap"><button class="daybtn on">DAY 1</button><button class="daybtn">DAY 2</button><button class="daybtn">ALL</button></div></nav><section class="schedule"><div class="wrap"><div class="stagehead"><b>TIME</b><b>STAGE A</b><b>STAGE B</b></div><div class="schedulegrid"><div class="timecol">12:00</div><div class="eventscol"><div class="eventbox"><b>节目名称</b><p>出演者</p></div><div class="eventbox"><b>节目名称</b><p>出演者</p></div></div><div class="timecol">14:30</div><div class="eventscol"><div class="eventbox"><b>节目名称</b><p>出演者</p></div><div class="eventbox"><b>节目名称</b><p>出演者</p></div></div><div class="timecol">17:00</div><div class="eventscol"><div class="eventbox"><b>节目名称</b><p>出演者</p></div><div class="eventbox"><b>节目名称</b><p>出演者</p></div></div></div></div></section>
<script>document.querySelectorAll('.daybtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.daybtn').forEach(x=>x.classList.remove('on'));b.classList.add('on')});</script></body></html>
