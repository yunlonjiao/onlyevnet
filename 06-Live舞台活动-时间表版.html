<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live / 舞台活动</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#111;font-family:Arial,"Noto Sans SC",sans-serif}a{text-decoration:none;color:inherit}button{font:inherit}:root{--red:#e43127;--blue:#1547c9;--ink:#111;--paper:#f4f1e8}.wrap{width:min(1220px,calc(100% - 36px));margin:auto}.nav{border-bottom:2px solid #111;background:#f4f1e8;position:sticky;top:0;z-index:20}.nav .wrap{height:64px;display:flex;align-items:center;gap:22px}.brand{font-weight:950}.links{display:flex;gap:18px;font-size:11px;font-weight:850;flex:1}.guide{background:var(--red);color:#fff;padding:9px 12px;font-size:11px;font-weight:900}.hero{padding:42px 0 24px}.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:end}.hero h1{font-size:clamp(70px,9vw,128px);line-height:.7;letter-spacing:-.075em;margin:0}.hero h1 span{color:var(--red)}.intro{border-left:2px solid #111;padding-left:24px}.intro p{max-width:520px;line-height:1.75;color:#5d5a54}.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid #111;border-bottom:2px solid #111;margin-top:22px}.facts div{padding:14px 0}.facts div+div{border-left:1px solid #aaa;padding-left:14px}.facts small{display:block;font-size:10px;color:#777}.daybar{background:var(--blue);color:white}.daybar .wrap{display:flex}.day{border:0;border-right:1px solid #ffffff55;background:transparent;color:white;padding:14px 20px;font-weight:900;font-size:11px}.day.on{background:white;color:var(--blue)}.section{padding:56px 0}.schedule{display:grid;grid-template-columns:170px 1fr;border-top:2px solid #111}.datecol{padding:20px 20px 20px 0;border-right:2px solid #111}.datecol .big{font-size:100px;line-height:.75;font-weight:950;color:var(--red)}.datecol small{display:block;margin-bottom:8px}.timeline{padding-left:20px}.event{display:grid;grid-template-columns:90px 120px 1fr 100px;gap:14px;padding:18px 0;border-bottom:1px solid #aaa}.time{font-size:23px;font-weight:950}.stage{font-size:10px;font-weight:900;color:var(--blue);letter-spacing:.1em}.event h3{margin:0 0 3px;font-size:21px}.event p{margin:0;color:#777}.status{text-align:right;font-size:10px;font-weight:900}.venues{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid #111}.venue{padding:20px;min-height:160px}.venue+ .venue{border-left:2px solid #111}.venue:nth-child(2){background:#dbe4ff}.venue:nth-child(3){background:#ffd8d4}.venue h3{font-size:28px;margin:0 0 8px}.footer{border-top:2px solid #111;padding:38px 0;color:#666}.footer .wrap{display:flex;justify-content:space-between}@media(max-width:800px){.links{display:none}.hero-grid,.schedule{grid-template-columns:1fr}.intro{border-left:0;border-top:2px solid #111;padding:18px 0 0}.datecol{border-right:0;border-bottom:2px solid #111}.event{grid-template-columns:70px 1fr 70px}.stage{display:none}.venues{grid-template-columns:1fr}.venue+ .venue{border-left:0;border-top:2px solid #111}}@media(max-width:520px){.facts{grid-template-columns:1fr}.facts div+div{border-left:0;border-top:1px solid #aaa;padding-left:0}.footer .wrap{display:block}}
.preview-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);background:#111;color:#fff;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:9999;box-shadow:0 8px 28px #0003}.preview-toast.show{opacity:1;transform:translate(-50%,0)}body{--test-kv:url("https://images.unsplash.com/photo-1771875797345-958779570e66?auto=format&fit=crop&q=82&w=2400")}.hero{background-image:linear-gradient(#f4f1e8e6,#f4f1e8e6),var(--test-kv);background-size:cover;background-position:center}</style></head><body><!-- Shared visual test image: Unsplash prPHDv4Gm7I, used across all templates for visual comparison. --><!-- Art direction: Swiss timetable modernist. Cream paper, red/blue system colors, strict time grid, no dark concert aesthetics. --><header class="nav"><div class="wrap"><div class="brand">活动名称</div><nav class="links"><a>日程</a><a>舞台</a><a>出演者</a><a>场地</a><a>指南</a></nav><a class="guide">观演指南</a></div></header><section class="hero"><div class="wrap hero-grid"><h1>TIME<br><span>TABLE</span></h1><div class="intro"><small>LIVE PROGRAM / 2026</small><p>按日期与舞台快速查找现场节目。</p><div class="facts"><div><small>DATE</small><b>05.01 — 05.03</b></div><div><small>OPEN</small><b>10:00 — 22:00</b></div><div><small>VENUE</small><b>城市 · 会场</b></div></div></div></div></section><div class="daybar"><div class="wrap"><button class="day on" data-day="all">ALL DAYS</button><button class="day" data-day="1">DAY 01</button><button class="day" data-day="2">DAY 02</button><button class="day" data-day="3">DAY 03</button></div></div><section class="section"><div class="wrap schedule"><aside class="datecol"><small id="dayLabel">ALL DAYS</small><div class="big" id="dayNumber">18—20</div><b>MAY / 2026</b></aside><div class="timeline" id="timeline"></div></div></section><section class="section"><div class="wrap"><h2 style="font-size:38px;margin-top:0">Stages / 场地</h2><div class="venues"><article class="venue"><h3>STAGE A</h3><p>主舞台 / 大型节目</p></article><article class="venue"><h3>STAGE B</h3><p>Talk / 嘉宾 / 互动企划</p></article><article class="venue"><h3>STAGE C</h3><p>小型 Live / 特别企划</p></article></div></div></section><footer class="footer"><div class="wrap"><span>活动名称</span><span>SNS · CONTACT · COPYRIGHT</span></div></footer><script>
const scheduleData={
 1:{label:'FRIDAY / DAY 01',num:'18',events:[['10:30','STAGE A','Opening Program','活动介绍与开场','FREE'],['12:00','STAGE B','Guest Talk Session','Guest 01 / Guest 02','DETAILS →'],['14:10','STAGE A','Live Performance','Artist 01 / Artist 02','DETAILS →']]},
 2:{label:'SATURDAY / DAY 02',num:'19',events:[['11:00','STAGE B','Creator Talk','Creator 01 / 02','DETAILS →'],['15:00','STAGE C','Special Program','联动企划','LIMITED'],['19:20','STAGE A','Night Live','Artist 03 / 04','DETAILS →']]},
 3:{label:'SUNDAY / DAY 03',num:'20',events:[['11:30','STAGE A','Guest Special','Guest 03 / 04','DETAILS →'],['16:00','STAGE B','Final Talk','Closing Session','FREE'],['20:00','STAGE A','Closing Live','Final Performance','DETAILS →']]}
};
const timeline=document.querySelector('#timeline'),dayLabel=document.querySelector('#dayLabel'),dayNumber=document.querySelector('#dayNumber');
function renderDay(key){const keys=key==='all'?['1','2','3']:[key];dayLabel.textContent=key==='all'?'ALL DAYS':scheduleData[key].label;dayNumber.textContent=key==='all'?'18—20':scheduleData[key].num;timeline.innerHTML=keys.flatMap(k=>scheduleData[k].events.map(e=>'<article class="event"><span class="time">'+e[0]+'</span><span class="stage">'+e[1]+'</span><div><h3>'+e[2]+'</h3><p>'+e[3]+'</p></div><span class="status">'+e[4]+'</span></article>')).join('')}
document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{document.querySelectorAll('.day').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderDay(b.dataset.day)});renderDay('all');
</script><div class="preview-toast" id="previewToast">此入口将在 CMS 中由主办方配置</div><script data-preview-link-handler>
(()=>{const toast=document.querySelector('#previewToast');let tm;document.querySelectorAll('a:not([href])').forEach(a=>{a.setAttribute('tabindex','0');a.addEventListener('click',e=>{e.preventDefault();if(!toast)return;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>toast.classList.remove('show'),1600)});a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();a.click()}})});})();
</script></body></html>
