<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>OnlyEvent Studio · IP ONLY</title><link rel="stylesheet" href="ip01.css?v=7.25.0"></head>
<body>
<header class="oe-bar"><a class="oe-back" href="/admin/">← 我的漫展</a><div class="oe-title"><b>IP ONLY</b><small>点页面上的内容直接编辑</small></div><div class="oe-actions"><span id="saveState">载入中…</span><button id="deviceBtn">手机</button><button id="previewModeBtn">预览</button><button id="openingBtn">开屏</button><button id="publishBtn" class="primary">发布</button></div></header>
<nav class="oe-pages" aria-label="页面区域"><button data-jump="top">首页</button><button data-jump="tickets">票务</button><button data-jump="highlights">企划</button><button data-jump="booths">摊位</button><button data-jump="stage">日程</button><button data-jump="community">社群</button></nav>
<main class="oe-stage studio-stage"><iframe id="preview" title="01 模板可视化预览"></iframe></main>
<aside class="oe-panel oe-context hidden" id="contextPanel"><div class="panel-head"><div><b id="contextTitle">编辑内容</b><small id="contextHint">点页面上的内容直接修改</small></div><button id="closeContext">×</button></div><div id="contextBody"></div></aside>
<aside class="oe-panel hidden" id="openingPanel"><div class="panel-head"><div><b>开屏动画</b><small>这里只编辑 01 模板开屏</small></div><button id="closeOpening">×</button></div><label>左侧标题<input id="introLeft" /></label><label>右侧标题<textarea id="introRight" rows="3"></textarea></label><label>进入按钮<input id="introButton" /></label><label>背景色<input id="introBg" type="color" /></label><label>票面色<input id="introPaper" type="color" /></label><label>文字/描边<input id="introInk" type="color" /></label><div class="row"><button id="replayIntro" class="primary">▶ 从头预览</button><button id="disableIntro">启用/关闭</button></div><small class="hint">编辑参数不会自动重播；只有点“从头预览”才播放。</small></aside>

<aside class="oe-panel hidden" id="elementPanel"><div class="panel-head"><div><b>元素样式</b><small id="elementPath">未选择元素</small></div><button id="closeElement">×</button></div><label>字号 <input id="styleFontSize" type="range" min="10" max="96" step="1" value="16"></label><label>文字颜色 <input id="styleColor" type="color" value="#17151b"></label><label>字重 <select id="styleWeight"><option value="">跟随模板</option><option value="400">常规 400</option><option value="700">粗体 700</option><option value="900">特粗 900</option></select></label><div class="align-row"><button data-align="left">左对齐</button><button data-align="center">居中</button><button data-align="right">右对齐</button></div><button id="resetElementStyle">恢复模板样式</button><small class="hint">直接点页面上的文字即可选中。修改样式时不刷新整页。</small></aside>

<aside class="oe-panel hidden" id="structurePanel"><div class="panel-head"><div><b id="structureTitle">页面结构</b><small id="structurePath">未选择模块</small></div><button id="closeStructure">×</button></div><div class="structure-actions"><button id="structureUp">↑ 上移</button><button id="structureDown">↓ 下移</button><button id="duplicateStructure">复制条目</button><button id="deleteStructure" class="danger">隐藏模块</button></div><label>恢复隐藏模块<select id="hiddenSections"><option value="">选择已隐藏模块</option></select></label><button id="restoreSection" disabled>恢复模块</button><small class="hint">点击模块空白处可选择结构；也可以直接拖拽模块/条目排序。文字与样式编辑仍然独立进行。</small></aside>
<div class="oe-toast" id="toast"></div><input id="imageInput" type="file" accept="image/*" hidden>
<div class="publish-dialog hidden" id="publishDialog"><div class="publish-card"><h3>发布 01 网站</h3><label>网址名称<input id="publishSlug" placeholder="例如 stardust-only"></label><p id="publishHint">发布后游客看到的就是当前 01 页面，不包含任何编辑控件。</p><div class="row end"><button id="publishCancel">取消</button><button id="publishConfirm" class="primary">确认发布</button></div></div></div>
<script src="ip01.js?v=7.25.0"></script></body></html>
