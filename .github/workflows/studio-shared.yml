name: Studio shared editor regression
on:
  push:
    branches:
      - refactor/03-shared-studio-core
  pull_request:
    paths:
      - 'v8/**'
      - 'tests/studio-shared.spec.mjs'
  workflow_dispatch:
jobs:
  shared-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check JavaScript module syntax
        run: |
          node --check v8/app.js
          node --check v8/editor/studio-entry.js
          node --check v8/editor/studio-crop.js
          node --check v8/editor/studio-history.js
          node --check v8/editor/studio-controls.js
      - name: Start static preview server
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 >/tmp/onlyevent-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8124/v8/index.html -o /dev/null
      - name: Run browser regression
        run: node --test tests/studio-shared.spec.mjs
