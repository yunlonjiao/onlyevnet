name: Capture real template covers
on:
  push:
    branches:
      - 'preview/guide-sakura-access'
    paths:
      - 'quality/capture-template-covers.mjs'
      - '.github/workflows/template-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        working-directory: quality
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Serve real Studio pages
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/onlyevent-http.log 2>&1 &
          sleep 2
      - name: Capture real homepage covers
        working-directory: quality
        run: node capture-template-covers.mjs
      - name: Commit captured images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/covers/template-01.png admin/covers/template-02.png admin/covers/template-03.png admin/covers/template-04.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update real browser screenshots of Template 01 and 02 [skip ci]"
          git push origin HEAD:preview/guide-sakura-access
