name: OnlyEvent renderer quality

on:
  push:
    branches:
      - main
      - 'preview/**'
    paths:
      - 'v8/**'
      - 'quality/**'
      - '.github/workflows/onlyevent-quality.yml'
  pull_request:
    paths:
      - 'v8/**'
      - 'quality/**'
      - '.github/workflows/onlyevent-quality.yml'

concurrency:
  group: onlyevent-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check
